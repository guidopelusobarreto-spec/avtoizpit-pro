<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="#0d1117"/>
  
  <!-- Subtle road symbol in background -->
  <rect x="88" y="20" width="16" height="152" rx="4" fill="#f97316" opacity="0.08"/>
  <rect x="20" y="88" width="152" height="16" rx="4" fill="#f97316" opacity="0.08"/>
  
  <!-- Orange accent line top -->
  <rect x="32" y="28" width="128" height="4" rx="2" fill="#f97316"/>
  
  <!-- Main text АИ -->
  <text x="96" y="112" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="72" 
        font-weight="900" 
        fill="#f97316" 
        text-anchor="middle"
        letter-spacing="-2">АИ</text>
  
  <!-- Subtitle PRO -->
  <text x="96" y="145" 
        font-family="Arial, sans-serif" 
        font-size="22" 
        font-weight="700" 
        fill="#e6edf3" 
        text-anchor="middle" 
        letter-spacing="8">PRO</text>
  
  <!-- Orange accent line bottom -->
  <rect x="32" y="160" width="128" height="4" rx="2" fill="#f97316"/>
</svg>